<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f093fb" />
      <stop offset="100%" stop-color="#f5576c" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43e97b" />
      <stop offset="100%" stop-color="#38f9d7" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #8b949e; letter-spacing: 1px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: bold; fill: #58a6ff; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #c9d1d9; font-weight: 500; }
      .stat-num { font-family: 'Courier New', Courier, monospace; font-size: 13px; font-weight: bold; fill: #38f9d7; }
      @keyframes pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.3; }
      }
      .pulsing-dot { animation: pulse 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="850" height="320" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="850" height="36" rx="12" fill="#161b22" />
  <rect x="0" y="24" width="850" height="12" fill="#161b22" />
  <line x1="0" y1="36" x2="850" y2="36" stroke="#30363d" stroke-width="1" />
  <circle cx="20" cy="18" r="5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="18" r="5" fill="#27c93f" />
  <text x="75" y="22" class="title">AI_NEURAL_ENGINE // ACTIVITY &amp; CAPABILITY MATRIX</text>
  <circle cx="820" cy="18" r="4" fill="#38f9d7" class="pulsing-dot" />
  <text x="765" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#38f9d7">LIVE</text>

  <!-- Left Column: Neural Model Optimization Curve -->
  <text x="30" y="68" class="header">⚡ NEURAL MODEL CONVERGENCE</text>
  <text x="30" y="86" class="title">OPTIMIZATION VELOCITY (LOSS &amp; ACCURACY)</text>

  <!-- Grid lines -->
  <line x1="30" y1="120" x2="380" y2="120" stroke="#21262d" stroke-dasharray="3,3" />
  <line x1="30" y1="160" x2="380" y2="160" stroke="#21262d" stroke-dasharray="3,3" />
  <line x1="30" y1="200" x2="380" y2="200" stroke="#21262d" stroke-dasharray="3,3" />
  <line x1="30" y1="240" x2="380" y2="240" stroke="#30363d" stroke-width="1" />

  <!-- Graph Curve & Area -->
  <path d="M 30,225 C 90,210 140,160 210,140 C 280,120 320,105 380,95 L 380,240 L 30,240 Z" fill="url(#areaGrad)" />
  <path d="M 30,225 C 90,210 140,160 210,140 C 280,120 320,105 380,95" fill="none" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)" />

  <!-- Secondary Loss Line -->
  <path d="M 30,110 C 90,135 150,185 220,205 C 290,225 330,230 380,235" fill="none" stroke="url(#purpleGrad)" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Graph Legend / Badges -->
  <circle cx="35" cy="270" r="4" fill="#00f2fe" />
  <text x="45" y="274" class="label">Accuracy: 98.4%</text>
  <circle cx="160" cy="270" r="4" fill="#f093fb" />
  <text x="170" y="274" class="label">Loss: 0.016</text>
  <circle cx="265" cy="270" r="4" fill="#43e97b" />
  <text x="275" y="274" class="label">Inference: 14ms</text>

  <!-- Divider -->
  <line x1="420" y1="50" x2="420" y2="295" stroke="#30363d" stroke-width="1" />

  <!-- Right Column: AI & Full Stack Capabilities -->
  <text x="450" y="68" class="header">🧠 CORE ENGINEERING STACK</text>
  <text x="450" y="86" class="title">SPECIALIZATION &amp; PRODUCTION PROFICIENCY</text>

  <!-- Skill 1: AI Automation & Agents -->
  <text x="450" y="115" class="label">AI Automation &amp; Intelligent Agents</text>
  <text x="795" y="115" class="stat-num">95%</text>
  <rect x="450" y="122" width="370" height="7" rx="3.5" fill="#21262d" />
  <rect x="450" y="122" width="351" height="7" rx="3.5" fill="url(#cyanGrad)" />

  <!-- Skill 2: Machine Learning & Python -->
  <text x="450" y="152" class="label">Machine Learning &amp; Python (Scikit, Pandas, OpenCV)</text>
  <text x="795" y="152" class="stat-num">93%</text>
  <rect x="450" y="159" width="370" height="7" rx="3.5" fill="#21262d" />
  <rect x="450" y="159" width="344" height="7" rx="3.5" fill="url(#purpleGrad)" />

  <!-- Skill 3: Angular & Next.js -->
  <text x="450" y="189" class="label">Modern Frontend (Angular, Next.js, TypeScript)</text>
  <text x="795" y="189" class="stat-num">90%</text>
  <rect x="450" y="196" width="370" height="7" rx="3.5" fill="#21262d" />
  <rect x="450" y="196" width="333" height="7" rx="3.5" fill="url(#cyanGrad)" />

  <!-- Skill 4: Node.js, Flask & Backend -->
  <text x="450" y="226" class="label">Backend &amp; APIs (Node.js, Flask, FastAPI)</text>
  <text x="795" y="226" class="stat-num">88%</text>
  <rect x="450" y="233" width="370" height="7" rx="3.5" fill="#21262d" />
  <rect x="450" y="233" width="325" height="7" rx="3.5" fill="url(#greenGrad)" />

  <!-- Skill 5: Data Pipelines & DevOps -->
  <text x="450" y="263" class="label">Data Pipelines &amp; DevOps (SQL, Docker, Git)</text>
  <text x="795" y="263" class="stat-num">86%</text>
  <rect x="450" y="270" width="370" height="7" rx="3.5" fill="#21262d" />
  <rect x="450" y="270" width="318" height="7" rx="3.5" fill="url(#cyanGrad)" />
</svg>